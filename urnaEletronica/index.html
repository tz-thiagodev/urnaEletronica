<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urna Eletronica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="templateUrna">
        <div id="telaUrna">
            <div id="imagemCandidato">

            </div>

            <div id="infoCandidato">
                <p id="numDigitado">teste</p>
            </div>

        </div>

        <div id="templateBotoes">
            <div id="botaoNumero">
                <button value="1">1</button>
                <button value="2">2</button>
                <button value="3">3</button>
                <button value="4">4</button>
                <button value="5">5</button>
                <button value="6">6</button>
                <button value="7">7</button>
                <button value="8">8</button>
                <button value="9">9</button>
                <button value="0">0</button>

            </div>
            <div id="botaoEscolha">
                <button id="botaoEscolhaConfirmar">CONFIRMAR</button>
                <button id="botaoEscolhaCorrigir">CORRIGIR</button>
                <button id="botaoEscolhaBranco">BRANCO</button>            
            </div>
        </div>
    </div>

    <script src="urna.js"></script>
    
</body>
</html>
